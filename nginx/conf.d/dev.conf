# Nginx HTTP-only config for local development
server {
    listen 80;
    server_name localhost;

    # Frontend SPA
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Docs
    location /api/docs {
        proxy_pass http://backend:8000/api/docs;
        proxy_set_header Host $host;
    }

    location /api/redoc {
        proxy_pass http://backend:8000/api/redoc;
        proxy_set_header Host $host;
    }

    location /api/openapi.json {
        proxy_pass http://backend:8000/api/openapi.json;
        proxy_set_header Host $host;
    }

    # HLS streams
    location /hls/ {
        alias /var/www/hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }

    # M3U playlist
    location /playlist.m3u {
        proxy_pass http://packager:8003/m3u;
        proxy_set_header Host $host;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        rewrite ^/grafana/(.*) /$1 break;
    }

    # Prometheus (dev only)
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        rewrite ^/prometheus/(.*) /$1 break;
    }
}
