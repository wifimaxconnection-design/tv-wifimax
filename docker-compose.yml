version: "3.9"

# =============================================================
# IPTV Platform – Docker Compose (Development / Staging)
# =============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

networks:
  iptv_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  iptv_monitoring:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  hls_streams:
  transcoded_streams:
  prometheus_data:
  grafana_data:
  nginx_logs:
  app_logs:

services:

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iptv_platform}
      POSTGRES_USER: ${POSTGRES_USER:-iptv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - iptv_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iptv_user} -d ${POSTGRES_DB:-iptv_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Redis Cache & Message Queue
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    <<: *default-restart
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - iptv_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Backend API (FastAPI)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *default-restart
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - app_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - iptv_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Auth Service (JWT / OAuth2)
  # ─────────────────────────────────────────────────────────────
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    <<: *default-restart
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - iptv_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Ingest Service (Multicast UDP receiver)
  # ─────────────────────────────────────────────────────────────
  ingest:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    <<: *default-restart
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      BACKEND_URL: http://backend:8000
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGEST_API_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
      - backend
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Transcoder Service (NVENC GPU)
  # ─────────────────────────────────────────────────────────────
  transcoder:
    build:
      context: ./services/transcoder
      dockerfile: Dockerfile
    <<: *default-restart
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      BACKEND_URL: http://backend:8000
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    volumes:
      - transcoded_streams:/streams/transcoded
      - hls_streams:/streams/hls
      - app_logs:/app/logs
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - iptv_internal
    depends_on:
      - redis
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Packager Service (HLS / RTSP / SRT / M3U / EPG)
  # ─────────────────────────────────────────────────────────────
  packager:
    build:
      context: ./services/packager
      dockerfile: Dockerfile
    <<: *default-restart
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
      BACKEND_URL: http://backend:8000
    volumes:
      - hls_streams:/streams/hls
      - transcoded_streams:/streams/transcoded
      - app_logs:/app/logs
    ports:
      - "127.0.0.1:8003:8003"
      - "8554:8554"       # RTSP
      - "9000:9000/udp"   # SRT
    networks:
      - iptv_internal
    depends_on:
      - redis
      - transcoder
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Odoo Connector
  # ─────────────────────────────────────────────────────────────
  odoo_connector:
    build:
      context: ./services/odoo_connector
      dockerfile: Dockerfile
    <<: *default-restart
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/5
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8005:8005"
    networks:
      - iptv_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_WS_URL: /ws
    <<: *default-restart
    networks:
      - iptv_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    <<: *default-restart
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - hls_streams:/var/www/hls:ro
      - nginx_logs:/var/log/nginx
    networks:
      - iptv_internal
    depends_on:
      - backend
      - frontend
      - packager
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────────────────────────
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    <<: *default-restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - iptv_internal
      - iptv_monitoring
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    <<: *default-restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - iptv_internal
      - iptv_monitoring
    depends_on:
      - prometheus
    logging: *default-logging
