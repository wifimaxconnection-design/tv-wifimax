name: CI – Build, Lint & Test

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/iptv-platform

jobs:
  # ─────────────────────────────────────────────────────────────
  lint-backend:
    name: Lint Backend (Ruff + Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff black
      - run: ruff check backend/ services/
      - run: black --check backend/ services/

  # ─────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iptv_test
          POSTGRES_USER: iptv_user
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx
        working-directory: backend
      - run: pytest tests/ -v --cov=app --cov-report=xml
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://iptv_user:testpassword@localhost:5432/iptv_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only

  # ─────────────────────────────────────────────────────────────
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_DB_PASSWORD/testpassword/g' .env
          sed -i 's/CHANGE_ME_REDIS_PASSWORD/testpassword/g' .env
          sed -i 's/CHANGE_ME_GRAFANA_PASSWORD/testpassword/g' .env
          sed -i 's/CHANGE_ME_STRONG_SECRET_KEY_32CHARS/test-secret-key-32-chars-minimum!!/g' .env
          sed -i 's/CHANGE_ME_JWT_SECRET_64CHARS/test-jwt-secret-64-chars-minimum-for-ci-pipeline-only!!!/g' .env
      - run: docker compose config --quiet
      - run: docker compose pull postgres redis --ignore-pull-failures || true

  # ─────────────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, validate-compose]
    strategy:
      matrix:
        service:
          - { name: backend, context: ./backend }
          - { name: ingest, context: ./services/ingest }
          - { name: transcoder, context: ./services/transcoder }
          - { name: packager, context: ./services/packager }
          - { name: auth, context: ./services/auth }
          - { name: odoo_connector, context: ./services/odoo_connector }
          - { name: frontend, context: ./frontend }
          - { name: nginx, context: ./nginx }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
